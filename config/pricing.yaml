# Pre-flight cost / time / SLA estimates for mok-tua.
# Numbers are planning defaults; refresh from provider pages as needed.

providers:
  local_desk:
    type: local
    cost_usd: 0.0
    est_still_sec: 25
    est_video_sec_per_s: 8
    sla: best-effort
    notes: "Live SM ComfyUI on desk-host (MPS); image/storyboard preferred"

  local_gpu:
    type: local
    cost_usd: 0.0
    est_still_sec: 12
    est_video_sec_per_s: 4
    sla: best-effort
    notes: "CUDA Comfy on GPU-host; video / Wan / I2V preferred"

  local_tower_cpu:
    type: local
    cost_usd: 0.0
    est_still_sec: 120
    est_video_sec_per_s: 40
    sla: best-effort
    notes: "No-GPU control / light CPU only (ML350 / R710 class)"

  hf_zerogpu_free:
    type: free_or_paid
    free_tier: true
    cost_usd: 0.0
    est_video_sec_per_s: 15
    clip_sec_typical: [4, 12]
    daily_quota_min: 5
    sla: free-tier-queue
    notes: "HF Spaces ZeroGPU free; short clips only"

  hf_zerogpu_pro:
    type: free_or_paid
    free_tier: false
    cost_usd: 0.0
    est_video_sec_per_s: 12
    clip_sec_typical: [4, 12]
    daily_quota_min: 40
    overage_usd_per_10min: 1.0
    sla: priority-queue
    notes: "HF Pro ~$9/mo; 40 min/day ZeroGPU; overage $1/10min"

  grok_imagine:
    type: paid
    cost_usd: 0.02
    est_still_sec: 8
    est_video_sec_per_s: 0
    sla: api
    notes: "xAI grok-imagine-image ~$0.002–0.05/img by resolution/quality; set XAI_API_KEY"
    env_key: XAI_API_KEY

  grok_imagine_quality:
    type: paid
    cost_usd: 0.05
    est_still_sec: 15
    est_video_sec_per_s: 0
    sla: api
    notes: "grok-imagine-image-quality higher tier"
    env_key: XAI_API_KEY

  grok_imagine_video:
    type: paid
    cost_usd: 0.0
    on_demand_per_hour: 0
    est_video_sec_per_s: 2
    cost_usd_per_sec: 0.01
    sla: api
    notes: "Planning: ~$0.01–0.07/sec depending on resolution; confirm xAI pricing"
    env_key: XAI_API_KEY

  nano_banana:
    type: paid
    cost_usd: 0.04
    est_still_sec: 10
    est_video_sec_per_s: 0
    sla: api
    notes: "Google Gemini / Comfy partner Nano Banana; confirm live Google/Comfy Cloud pricing"
    env_keys: [GOOGLE_API_KEY, GEMINI_API_KEY, COMFY_API_KEY]

  seedance_cloud:
    type: paid
    cost_usd: 0.0
    est_video_sec_per_s: 5
    sla: partner
    notes: "ByteDance Seedance via Comfy partner nodes / Comfy Cloud; earmark"
    status: earmark

  runpod_rtx4090:
    type: paid
    on_demand_per_hour: 0.39
    spot_per_hour: 0.22
    min_bill_seconds: 1
    est_video_sec_per_s: 3
    sla: on-demand
    notes: "Planning stub; confirm live prices"

  vast_cheap:
    type: paid
    on_demand_per_hour: 0.25
    est_video_sec_per_s: 4
    sla: spot-variable
    notes: "Planning stub"

  # Trusted federation / future crowd (ask_packet.v1). Not a public market yet.
  # Join key: tier_lock lock_ref on node advertisements (config/crowd_nodes.json).
  crowd_federated:
    type: crowd
    cost_usd: 0.0
    est_still_sec: 40
    est_video_sec_per_s: 12
    sla: best-effort-retry
    data_classes: [public]
    status: earmark
    notes: "Trusted lab federation first (desk-host/gpu-host/tower). PHI structurally unroutable. See docs/ASK_PACKET_FEDERATION.md"

defaults:
  prefer:
    - local_desk
    - local_gpu
    - grok_imagine
    - nano_banana
    - hf_zerogpu_pro
    - hf_zerogpu_free
    - crowd_federated
    - runpod_rtx4090
  refuse_if_data_class:
    - phi
    - phi-adjacent
  # Packet emit invariant: crowd_federated only when data_class=public (QQQ3+)
