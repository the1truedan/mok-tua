<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Vendor showcase frame</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b1220;
    color: #e8eefc;
    font: 14px/1.4 system-ui, sans-serif;
    padding: 24px;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  .tag {
    display: inline-block;
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #4fd1c5;
    border: 1px solid #2a3a58;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  h1 { font-size: 22px; margin-bottom: 6px; letter-spacing: -0.02em; }
  .sub { color: #9db0d0; margin-bottom: 16px; max-width: 70ch; }
  .stage {
    background: #121a2e;
    border: 1px solid #2a3a58;
    border-radius: 14px;
    padding: 10px;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
  }
  .stage img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
  }
  .credit {
    margin-top: 12px;
    font-size: 12px;
    color: #9db0d0;
  }
  .credit a { color: #f0a35e; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tag" id="tag">vendor UI</div>
    <h1 id="title">Title</h1>
    <p class="sub" id="sub">Subtitle</p>
    <div class="stage">
      <img id="img" alt="" />
    </div>
    <p class="credit" id="credit"></p>
  </div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById("tag").textContent = q.get("tag") || "vendor UI";
document.getElementById("title").textContent = q.get("title") || "Tool";
document.getElementById("sub").textContent = q.get("sub") || "";
document.getElementById("img").src = q.get("src") || "";
document.getElementById("img").alt = q.get("title") || "screenshot";
document.getElementById("credit").innerHTML = q.get("credit") || "";
</script>
</body>
</html>
